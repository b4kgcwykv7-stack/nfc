services:
  - type: web
    name: nfc-pix-display
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nfc-pix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false
      - key: SUPPORT_WHATSAPP
        value: "5584999377777"
databases:
  - name: nfc-pix-db
    plan: free
