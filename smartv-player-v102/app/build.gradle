plugins { id 'com.android.application' }

android {
    namespace 'br.com.smartv.player'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.smartv.player'
        minSdk 19
        targetSdk 35
        versionCode 108
        versionName '1.0.8'
    }

    flavorDimensions 'edition'
    productFlavors {
        standard {
            dimension 'edition'
            manifestPlaceholders = [appLabel: 'Smartv Player']
        }
        compat {
            dimension 'edition'
            applicationIdSuffix '.compat'
            versionNameSuffix '-compat'
            manifestPlaceholders = [appLabel: 'Smartv Player Compat']
        }
    }
}
