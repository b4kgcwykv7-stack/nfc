name: Publish Smartv Player v1.0.8

on:
  push:
    branches:
      - smartv-apk-build-v108
    paths:
      - '.github/workflows/smartv-release-v108.yml'
      - 'smartv-player-v102/RELEASE_TRIGGER_v108.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        working-directory: smartv-player-v102
        run: gradle :app:assembleStandardDebug :app:assembleCompatDebug --stacktrace

      - name: Prepare release files
        run: |
          mkdir -p output
          cp smartv-player-v102/app/build/outputs/apk/standard/debug/app-standard-debug.apk output/Smartv-Player-v1.0.8.apk
          cp smartv-player-v102/app/build/outputs/apk/compat/debug/app-compat-debug.apk output/Smartv-Player-v1.0.8-compat.apk
          sha256sum output/Smartv-Player-v1.0.8.apk > output/Smartv-Player-v1.0.8.sha256.txt
          sha256sum output/Smartv-Player-v1.0.8-compat.apk > output/Smartv-Player-v1.0.8-compat.sha256.txt
            output/Smartv-Player-v1.0.8-compat.zip
          cd output && zip -j Smartv-Player-v1.0.8-compat.zip Smartv-Player-v1.0.8-compat.apk && cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smartv-player-v1.0.8
          name: Smartv Player v1.0.8
          body: |
            Smartv Player v1.0.8 para Android TV / Google TV / TV Box.
            
            - Smartv-Player-v1.0.8.apk: instalação padrão.
            - Smartv-Player-v1.0.8-compat.apk: compatibilidade para TVs com conflito de assinatura/pacote.
            - Android 4.4+ (API 19).
          files: |
            output/Smartv-Player-v1.0.8.apk
            output/Smartv-Player-v1.0.8-compat.apk
            output/Smartv-Player-v1.0.8.sha256.txt
            output/Smartv-Player-v1.0.8-compat.sha256.txt
          fail_on_unmatched_files: true
