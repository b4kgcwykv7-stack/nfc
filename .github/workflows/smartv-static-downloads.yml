name: Publish Smartv static downloads

on:
  push:
    branches:
      - smartv-apk-build-v108
    paths:
      - '.github/workflows/smartv-static-downloads.yml'
      - 'smartv-player-v102/STATIC_TRIGGER.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APKs
        working-directory: smartv-player-v102
        run: gradle :app:assembleStandardDebug :app:assembleCompatDebug --stacktrace
      - name: Prepare files
        run: |
          mkdir -p /tmp/smartv-downloads
          cp smartv-player-v102/app/build/outputs/apk/standard/debug/app-standard-debug.apk /tmp/smartv-downloads/Smartv-Player-v1.0.8.apk
          cp smartv-player-v102/app/build/outputs/apk/compat/debug/app-compat-debug.apk /tmp/smartv-downloads/Smartv-Player-v1.0.8-compat.apk
          cd /tmp/smartv-downloads
          zip -j Smartv-Player-v1.0.8-compat.zip Smartv-Player-v1.0.8-compat.apk
          sha256sum *.apk > SHA256SUMS.txt
      - name: Publish download branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan smartv-downloads
          git rm -rf . || true
          cp /tmp/smartv-downloads/* .
          git add .
          git commit -m "Smartv Player v1.0.8 static downloads"
          git push --force origin smartv-downloads
