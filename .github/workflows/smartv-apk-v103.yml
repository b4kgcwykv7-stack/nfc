name: Smartv APK v1.0.3

on:
  push:
    branches:
      - smartv-apk-build-v103
    paths:
      - 'smartv-player-v102/**'
      - '.github/workflows/smartv-apk-v103.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: smartv-player-v102
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p output
          cp smartv-player-v102/app/build/outputs/apk/debug/app-debug.apk output/Smartv-Player-v1.0.3.apk
          sha256sum output/Smartv-Player-v1.0.3.apk > output/Smartv-Player-v1.0.3.sha256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smartv-Player-v1.0.3
          path: output/
          if-no-files-found: error
